<!DOCTYPE html> 
<html lang="it"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Slot Machine 3x3 - CrazyGames Edition</title> 
    <style> 
        body { 
            background-color: #0e0e10; 
            color: white; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
        } 
        .slot-container { 
            margin: 20px auto; 
            max-width: 300px; 
            background: #18181b; 
            padding: 15px; 
            border-radius: 10px; 
            border: 3px solid #ffcc00; 
        } 
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 20px; 
        } 
        .cell { 
            background: #27272a; 
            font-size: 2rem; 
            padding: 20px 0; 
            border-radius: 5px; 
        } 
        button { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 10px; 
        } 
        #btn-gira { 
            background-color: #ef4444; 
        } 
        #btn-bonus { 
            background-color: #eab308; 
            color: black; 
        } 
        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        } 
        #status { 
            margin-top: 10px; 
            color: #eab308; 
        } 
    </style> 
    <!-- 1. CARICAMENTO SDK CRAZYGAMES V3 CORRETTO --> 
    <script src="https://crazygames.com"></script> 
</head> 
<body> 

    <h1>Slot Machine 3x3</h1> 
    <h2 id="saldo-display">Caricamento saldo...</h2> 
    
    <div class="slot-container"> 
        <!-- Griglia 3x3 --> 
        <div class="grid" id="slot-grid"> 
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div> 
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div> 
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div> 
        </div> 
        
        <!-- Pulsanti di Gioco --> 
        <button id="btn-gira" onclick="giraSlot()" disabled>GIRA ($5)</button> 
        <button id="btn-bonus" onclick="riceviBonus()" disabled>📺 BONUS GRATIS (+$100)</button> 
        
        <div id="status">Inizializzazione SDK in corso...</div> 
    </div> 

    <!-- 2. LOGICA DI GIOCO E INTEGRAZIONE SDK --> 
    <script> 
        let saldo = 100; 
        const simboli = ["😜", "🔥", "😎", "💎", "💖"]; 

        const saldoDisplay = document.getElementById("saldo-display");
        const btnGira = document.getElementById("btn-gira");
        const btnBonus = document.getElementById("btn-bonus");
        const statusTxt = document.getElementById("status");
        const gridCells = document.querySelectorAll(".cell");

        // Funzione di avvio per inizializzare CrazyGames
        async function inizializzaGioco() {
            try {
                statusTxt.innerText = "Connessione a CrazyGames...";
                
                // Inizializza l'SDK ufficiale v3
                await window.CrazyGames.SDK.init();
                console.log("CrazyGames SDK inizializzato con successo.");

                // Comunica alla piattaforma l'inizio del gameplay
                window.CrazyGames.SDK.game.gameplayStart();

                // Recupera i dati salvati
                recuperaSalvataggi();

                // Gestione dei parametri d'invito multiplayer ("roomName")
                if (window.CrazyGames?.SDK?.game) {
                    const nomeStanza = await window.CrazyGames.SDK.game.getInviteParam("roomName");
                    if (nomeStanza) {
                        console.log("Giocatore unito tramite invito alla stanza:", nomeStanza);
                        statusTxt.innerText = "Ti sei unito alla stanza: " + nomeStanza;
                    } else {
                        statusTxt.innerText = "Buona fortuna! Nessuna stanza rilevata.";
                    }
                }

                // Sblocca i comandi di gioco
                btnGira.disabled = false;
                btnBonus.disabled = false;
            } catch (error) {
                console.error("Errore nell'inizializzazione dell'SDK:", error);
                statusTxt.innerText = "Errore SDK. Esecuzione in modalità locale.";
                
                aggiornaGraficaSaldo();
                btnGira.disabled = false;
                btnBonus.disabled = false;
            }
        }

        // Recupera il saldo dal Cloud di CrazyGames
        function recuperaSalvataggi() {
            try {
                if (window.CrazyGames?.SDK?.data) {
                    const saldoSalvato = window.CrazyGames.SDK.data.getItem("slot_user_saldo");
                    if (saldoSalvato !== null) {
                        saldo = parseInt(saldoSalvato, 10);
                        console.log("Salvataggio cloud caricato. Saldo:", saldo);
                    }
                }
            } catch (e) {
                console.warn("Modulo dati SDK non disponibile in locale:", e);
            }
            aggiornaGraficaSaldo();
        }

        // Salva i progressi nel Cloud di CrazyGames
        function salvaProgressi() {
            aggiornaGraficaSaldo();
            try {
                if (window.CrazyGames?.SDK?.data) {
                    window.CrazyGames.SDK.data.setItem("slot_user_saldo", saldo.toString());
                }
            } catch (e) {
                console.error("Errore durante il salvataggio dei progressi:", e);
            }
        }

        function aggiornaGraficaSaldo() {
            saldoDisplay.innerText = "$" + saldo;
        }

        function giraSlot() {
            if (saldo < 5) {
                statusTxt.innerText = "Fondi insufficienti! Riscatta il bonus gratis.";
                return;
            }

            saldo -= 5;
            salvaProgressi();
            statusTxt.innerText = "I rulli girano...";

            let risultati = [];
            gridCells.forEach(cell => {
                const simboloCasuale = simboli[Math.floor(Math.random() * simboli.length)];
                cell.innerText = simboloCasuale;
                risultati.push(simboloCasuale);
            });

            // LOGICA DI VINCITA CORRETTA AL 100%
            const riga1 = (risultati[0] === risultati[1] && risultati[1] === risultati[2]);
            const riga2 = (risultati[3] === risultati[4] && risultati[4] === risultati[5]);
            const riga3 = (risultati[6] === risultati[7] && risultati[7] === risultati[8]);

            if (riga1 || riga2 || riga3) {
                const vincita = 50;
                saldo += vincita;
                statusTxt.innerText = "TRIPLO SIMBOLO! Hai vinto $" + vincita + "! 🎉";
                salvaProgressi();
            } else {
                statusTxt.innerText = "Ritenta! La fortuna gira.";
            }
        }

        // Gestione del video pubblicitario premiato (Rewarded Ad)
        function riceviBonus() {
            if (window.CrazyGames?.SDK?.ad) {
                btnGira.disabled = true;
                btnBonus.disabled = true;
                statusTxt.innerText = "Caricamento dell'annuncio...";

                window.CrazyGames.SDK.ad.requestAd("rewarded", {
                    adStarted: () => {
                        statusTxt.innerText = "Guarda tutto l'annuncio per riscuotere il tuo bonus.";
                    },
                    adFinished: () => {
                        saldo += 100;
                        statusTxt.innerText = "Bonus di $100 accreditato! 🎁";
                        salvaProgressi();
                        btnGira.disabled = false;
                        btnBonus.disabled = false;
                    },
                    adError: (error) => {
                        console.error("Errore ad:", error);
                        statusTxt.innerText = "Impossibile caricare il video. Riprova più tardi.";
                        btnGira.disabled = false;
                        btnBonus.disabled = false;
                    }
                });
            } else {
                statusTxt.innerText = "Annunci non disponibili in modalità locale.";
            }
        }

        // Attivazione automatica dell'inizializzazione
        window.addEventListener("DOMContentLoaded", inizializzaGioco);
    </script> 
</body> 
</html>
