<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine 3x3</title>
    <style>
        body { font-family: sans-serif; background: #121214; text-align: center; color: white; padding: 20px; }
        .container { max-width: 450px; margin: 20px auto; background: #1a1a1e; padding: 25px; border-radius: 20px; border: 1px solid #2f2f37; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #f1c40f; margin-bottom: 10px; }
        .stats { font-size: 18px; margin-bottom: 20px; }
        #credits { color: #2ecc71; font-weight: bold; font-size: 24px; }
        
        /* Griglia della slot machine (3 colonne per 3 righe) */
        .slot-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
            background: #08080a; 
            padding: 15px; 
            border-radius: 15px; 
            border: 4px solid #f1c40f;
            margin-bottom: 25px;
        }
        
        /* Stile di ogni singola casella dei rulli */
        .cell { 
            background: #26262b; 
            color: white; 
            font-size: 42px; 
            height: 90px; 
            line-height: 90px; 
            border-radius: 10px; 
            font-weight: bold; 
            border: 1px solid #444; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        
        .btn { background: #e74c3c; color: white; border: none; padding: 16px; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; text-transform: uppercase; box-shadow: 0 5px #c0392b; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #c0392b; }
        .btn:disabled { background: #555 !important; box-shadow: none !important; cursor: not-allowed; }
        #message { font-size: 18px; margin-top: 20px; color: #f1c40f; font-weight: bold; min-height: 26px; }
        
        /* Spazio contenitore per il banner pubblicitario */
        .ad-banner { margin-top: 20px; min-height: 60px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎰 VEGAS 3X3 SLOT 🎰</h1>
        
        <div class="stats">Monete: $<span id="credits">200</span></div>

        <!-- Struttura della griglia con 9 caselle totali -->
        <div class="slot-grid">
            <!-- Prima riga -->
            <div class="cell" id="c0">💖</div><div class="cell" id="c1">🌸</div><div class="cell" id="c2">💎</div>
            <!-- Seconda riga -->
            <div class="cell" id="c3">😎</div><div class="cell" id="c4">😜</div><div class="cell" id="c5">🔥</div>
            <!-- Terza riga -->
            <div class="cell" id="c6">💎</div><div class="cell" id="c7">💖</div><div class="cell" id="c8">🌸</div>
        </div>

        <button class="btn" id="spinBtn" onclick="spin()">GIRA ($5)</button>
        
        <div id="message">Fai girare i rulli!</div>

        <!-- BANNER 468x60 DI ADSTERRA INSERITO QUI -->
        <div class="ad-banner">
            <script type="text/javascript">
                atOptions = {
                    'key' : '245bd3ddfef1518b3af92d30a2b912f3',
                    'format' : 'iframe',
                    'height' : 60,
                    'width' : 468,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="//://highperformanceformat.com"></script>
        </div>
    </div>

    <script>
        // Set di simboli: Cuori, Fiori, Diamanti, Faccine
        const simboli = ['💖', '🌸', '💎', '😎', '😜', '🔥'];
        let monete = 200;
        const COSTO_GIRO = 5;

        function spin() {
            if (monete < COSTO_GIRO) {
                document.getElementById('message').innerText = "❌ Monete finite! Ricarica la pagina.";
                return;
            }

            // Scala il costo del giro e disattiva il pulsante per evitare bug
            monete -= COSTO_GIRO;
            document.getElementById('credits').innerText = monete;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('message').innerText = "I rulli girano...";

            let giriEffettuati = 0;
            let timerAnimazione = setInterval(function() {
                // Effetto rotazione casuale su tutte e 9 le celle contemporaneamente
                for (let i = 0; i < 9; i++) {
                    document.getElementById('c' + i).innerText = simboli[Math.floor(Math.random() * simboli.length)];
                }
                giriEffettuati++;

                // Quando l'animazione termina (dopo 1 secondo)
                if (giriEffettuati >= 10) {
                    clearInterval(timerAnimazione);

                    // Estrazione dei simboli finali stabili
                    let g = [];
                    for (let i = 0; i < 9; i++) {
                        g[i] = simboli[Math.floor(Math.random() * simboli.length)];
                        document.getElementById('c' + i).innerText = g[i];
                    }

                    // Logica di controllo delle combinazioni vincenti
                    let vincitaTotale = 0;
                    let haVinto = false;

                    // 1. Controllo Linee Orizzontali
                    if (g[0] === g[1] && g[1] === g[2]) { vincitaTotale += 30; haVinto = true; }
                    if (g[3] === g[4] && g[4] === g[5]) { vincitaTotale += 30; haVinto = true; }
                    if (g[6] === g[7] && g[7] === g[8]) { vincitaTotale += 30; haVinto = true; }

                    // 2. Controllo Linee Diagonali
                    if (g[0] === g[4] && g[4] === g[8]) { vincitaTotale += 50; haVinto = true; }
                    if (g[2] === g[4] && g[4] === g[6]) { vincitaTotale += 50; haVinto = true; }

                    // Gestione del messaggio di esito
                    if (haVinto) {
                        monete += vincitaTotale;
                        document.getElementById('message').innerText = "🎉 HAI VINTO +$" + vincitaTotale + "! 🎉";
                    } else {
                        document.getElementById('message').innerText = "Ritenta! La fortuna gira.";
                    }

                    // Aggiorna il bilancio grafico delle monete e riattiva il tasto Gira
                    document.getElementById('credits').innerText = monete;
                    document.getElementById('spinBtn').disabled = false;
                }
            }, 100);
        }
    </script>

    <!-- CODICE SOCIALBAR DI ADSTERRA INSERITO IN FONDO PRIMA DELLA CHIUSURA DEL CORPO -->
    <script data-cfasync="false" src="https://bauval.org"></script>

</body>
</html>
