<!DOCTYPE html>
<html lang="it">
<head>

    <title>Vegas Gold Slot</title>
    <style>
        body {

            color: white; 
            padding: 20px; 
            margin: 0;

        }

        .container { 
            max-width: 620px;

            background: linear-gradient(145deg, #151518, #1f1f26); 
            padding: 30px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
            border: 1px solid #2d2d35; 
            position: relative; 
        }

        h1 { 
            color: #f1c40f; 
            font-size: 34px; 
            margin-bottom: 5px; 
            text-shadow: 0 0 15px rgba(241,196,15,0.6); 
        }

        .stats-grid { 
            background: #0b0b0d; 
            padding: 12px; 
            border-radius: 14px; 
            border: 1px solid #222;
            margin-bottom: 25px;
        }
        
        .stat-box { font-size: 14px; color: #888; text-transform: uppercase; }
        
        .stat-box span { 
            display: block; 
            font-size: 28px; 
            font-weight: 800; 
            margin-top: 5px; 
        }
        
        #credits { 
            color: #2ecc71; 
            text-shadow: 0 0 10px rgba(46,204,113,0.5);
        }

        .slot-machine { 
            background: #08080a; 
            border: 5px solid #f1c40f; 
            border-radius: 20px; 
            padding: 25px; 
            margin-bottom: 25px; 
            position: relative; 
            box-shadow: 0 0 25px rgba(241,196,15,0.3);
        }

        .reels { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 25px; 
        }

        .reel { 
            background: rgba(255,255,255,0.05);
            color: #fff; 
            font-size: 48px; 
            width: 90px; 
            height: 110px; 
            line-height: 110px; 
            border-radius: 14px; 
            font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .btn { border: none; padding: 16px 35px; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; text-transform: uppercase; }
        
        .btn-spin { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); 
            color: white; 
            box-shadow: 0 6px #962d22; 
            margin-bottom: 10px; 
        }
        
        .btn-spin:active { transform: translateY(4px); box-shadow: 0 2px #962d22; }
        .btn-spin:disabled { background: #333 !important; color: #666 !important; box-shadow: none !important; cursor: not-allowed; }

        #message { 
            font-size: 18px; 
            margin: 15px 0; 
            height: 28px; 
            font-weight: 600; 
            color: #f1c40f; 
        }
        
        .ad-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.98);
            z-index: 100;
            border-radius: 24px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px;
            box-sizing: border-box;
        }
        
        .ad-overlay h2 { color: #e74c3c; font-size: 28px; margin-bottom: 12px; }
        .ad-overlay p { color: #aaa; font-size: 16px; margin-bottom: 30px; }
        
        .btn-ad-trigger { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            color: white; 
            font-size: 18px; 
            padding: 18px; 
            width: 85%; 
            text-decoration: none; 
            display: block; 
            border-radius: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            box-sizing: border-box; 
        }

        .ad-banner-container {
            margin: 20px auto;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 14px;
            max-width: 620px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 11px;
            box-sizing: border-box;
        }
    </style>
</head>
