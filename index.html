<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Slot Premium</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; text-align: center; color: white; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #1a1a1e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #2f2f37; }
        h1 { color: #f1c40f; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(241,196,15,0.3); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; background: #26262b; padding: 15px; border-radius: 12px; }
        .stat-box { font-size: 16px; color: #aaa; text-align: left; }
        .stat-box span { display: block; font-size: 22px; font-weight: bold; color: #fff; margin-top: 5px; }
        .stat-box #credits { color: #2ecc71; }
        .slot-machine { background: #111; border: 4px solid #f1c40f; border-radius: 15px; padding: 20px; margin-bottom: 20px; position: relative; }
        .reels { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .reel { background: #fff; color: #000; font-size: 55px; width: 90px; height: 110px; line-height: 110px; border-radius: 10px; font-weight: bold; transition: transform 0.1s; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
        .btn { border: none; padding: 15px 35px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.2s; text-transform: uppercase; }
        .btn-spin { background: #e74c3c; color: white; box-shadow: 0 5px #c0392b; margin-bottom: 15px; }
        .btn-spin:active { box-shadow: 0 2px #c0392b; transform: translateY(3px); }
        .btn-spin:disabled { background: #555 !important; box-shadow: none !important; cursor: not-allowed; transform: none; }
        .btn-ad { background: #3498db; color: white; box-shadow: 0 5px #2980b9; display: none; font-size: 16px; padding: 12px; }
        .btn-ad:active { box-shadow: 0 2px #2980b9; transform: translateY(3px); }
        #message { font-size: 20px; margin: 15px 0; height: 28px; font-weight: bold; color: #f1c40f; }
        .xp-bar-container { background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .xp-bar { background: #f1c40f; height: 100%; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎰 VEGAS GOLD SLOT 🎰</h1>
        <p style="color: #666; margin: 0 0 20px 0; font-size: 14px;">Gioca gratis • Sblocca livelli</p>

        <div class="stats-grid">
            <div class="stat-box">Monete <span>\$<span id="credits">100</span></span></div>
            <div class="stat-box">Livello <span id="level">1</span>
                <div class="xp-bar-container"><div class="xp-bar" id="xpBar"></div></div>
            </div>
        </div>

        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1">💎</div>
                <div class="reel" id="reel2">💎</div>
                <div class="reel" id="reel3">💎</div>
            </div>
            <button class="btn btn-spin" id="spinBtn" onclick="spin()">Gira (\$10)</button>
            <button class="btn btn-ad" id="adBtn" onclick="watchAd()">📺 Guarda un video (+50 Monete)</button>
        </div>

        <div id="message">Benvenuto! Clicca su Gira!</div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        let credits = 100;
        let xp = 0;
        let level = 1;
        const xpPerLevel = 100;

        function spin() {
            if (credits < 10) {
                updateMessage("❌ Monete insufficienti! Guarda un video.");
                return;
            }

            // Consumo crediti e aggiornamento UI
            credits -= 10;
            document.getElementById('credits').innerText = credits;
            document.getElementById('spinBtn').disabled = true;
            updateMessage("I rulli girano...");

            let count = 0;
            let interval = setInterval(() => {
                document.getElementById('reel1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                count++;
                
                if (count > 12) {
                    clearInterval(interval);
                    document.getElementById('spinBtn').disabled = false;
                    checkWin();
                    gainXP(15); // Guadagna 15 XP ogni giro
                }
            }, 80);
        }

        function checkWin() {
            const r1 = document.getElementById('reel1').innerText;
            const r2 = document.getElementById('reel2').innerText;
            const r3 = document.getElementById('reel3').innerText;

            if (r1 === r2 && r2 === r3) {
                let win = 80;
                if (r1 === '7️⃣') win = 300; 
                credits += win;
                updateMessage(`🎉 TRIS! Hai vinto $${win}! 🎉`);
                gainXP(40); // Più esperienza per la vincita
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                credits += 15;
                updateMessage("😅 COPPIA! Rimani in gara (+\$15)");
            } else {
                updateMessage("Ritenta! La fortuna gira.");
            }
            
            document.getElementById('credits').innerText = credits;
            checkCreditsStatus();
        }

        function gainXP(amount) {
            xp += amount;
            if (xp >= xpPerLevel) {
                xp = xp - xpPerLevel;
                level++;
                document.getElementById('level').innerText = level;
                credits += 50; // Bonus livello
                updateMessage(`🌟 LIVELLO SUPERATO! Livello ${level} (+$50) 🌟`);
            }
            document.getElementById('xpBar').style.width = (xp / xpPerLevel * 100) + '%';
        }

        function checkCreditsStatus() {
            if (credits < 10) {
                document.getElementById('adBtn').style.display = 'block';
                document.getElementById('spinBtn').disabled = true;
            } else {
                document.getElementById('adBtn').style.display = 'none';
                document.getElementById('spinBtn').disabled = false;
            }
        }

        function watchAd() {
            updateMessage("🎬 Simulazione pubblicità in corso (5 secondi)...");
            document.getElementById('adBtn').disabled = true;
            
            setTimeout(() => {
                credits += 60;
                document.getElementById('credits').innerText = credits;
                document.getElementById('adBtn').disabled = false;
                updateMessage("💰 +60 Monete accreditate con successo!");
                checkCreditsStatus();
            }, 3000); // 3 secondi di attesa simulata
        }

        function updateMessage(text) {
            document.getElementById('message').innerText = text;
        }
    </script>
</body>
</html>
