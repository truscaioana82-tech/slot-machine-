    <script>
        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        let credits = 200; 
        const SPIN_COST = 5; 

        // CONFIGURAZIONE VIDEO PUBBLICITARI
        let spinCounter = 0; 
        const GIRI_PER_MOSTRARE_VIDEO = 3; // Modificato a 3 giri su tua richiesta

        window.onload = function() {
            document.getElementById('credits').innerText = credits;
            document.getElementById('spinBtn').innerText = `Gira ($${SPIN_COST})`;
            document.getElementById('adOverlay').style.display = 'none';
            document.getElementById('spinBtn').disabled = false;
        };

        function showVideoAd() {
            // 1. Schermata di blocco temporanea per la riproduzione del video
            const overlay = document.getElementById('adOverlay');
            overlay.innerHTML = `
                <h2>📺 GUARDA IL VIDEO</h2>
                <p>Un breve sponsor per sbloccare i prossimi 3 giri della slot machine!</p>
                <div style="margin: 20px auto; width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #f1c40f; border-radius: 50%; animation: ad-spin 1s linear infinite;"></div>
                <style>
                    @keyframes ad-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                </style>
            `;
            overlay.style.display = 'flex';
            document.getElementById('spinBtn').disabled = true;

            // 2. INTEGRAZIONE DEL TUO SCRIPT VIDEO REALE
            // Al momento simula una durata di 5 secondi, poi chiude il video e fa continuare il gioco
            
            /* --- INCOLLA QUI IL CODICE INTERSTITIAL/VIDEO DEL TUO AD NETWORK (Es. Adsterra, Monetag) --- */
            
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('message').innerText = "✅ Video completato! Altri 3 giri sbloccati.";
                
                // Ripristino della struttura predefinita in caso di crediti esauriti
                overlay.innerHTML = `
                    <h2> 💸 CREDITI ESAURITI! 💸</h2>
                    <p>Hai finito le monete. Clicca qui sotto per aprire la pubblicità e ottenere subito +100 crediti gratis!</p>
                    <a href="https://asiafilm.org" target="_blank" class="btn-ad-trigger" id="adBtn" onclick="claimCredits()">Aggiungi Crediti</a>
                `;
            }, 5000); // Puoi modificare i 5000 millisecondi (5 secondi) in base alla durata media dello spot
        }

        function spin() {
            if (credits < SPIN_COST) {
                checkCreditsStatus();
                return;
            }

            // Controllo della frequenza: si attiva precisamente al terzo giro eseguito
            spinCounter++;
            if (spinCounter >= GIRI_PER_MOSTRARE_VIDEO) {
                spinCounter = 0; // Azzera il contatore per i successivi 3 giri
                showVideoAd();   // Lancia l'interstitial video
                return;
            }

            credits -= SPIN_COST;
            document.getElementById('credits').innerText = credits;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('message').innerText = "I rulli girano...";

            let count = 0;
            let interval = setInterval(() => {
                document.getElementById('reel1').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel2').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel3').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel4').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                document.getElementById('reel5').innerText = symbols[Math.floor(Math.random() * symbols.length)];
                count++;

                if (count >= 10) {
                    clearInterval(interval);
                    
                    let r1 = symbols[Math.floor(Math.random() * symbols.length)];
                    let r2 = symbols[Math.floor(Math.random() * symbols.length)];
                    let r3 = symbols[Math.floor(Math.random() * symbols.length)];
                    let r4 = symbols[Math.floor(Math.random() * symbols.length)];
                    let r5 = symbols[Math.floor(Math.random() * symbols.length)];
                    
                    document.getElementById('reel1').innerText = r1;
                    document.getElementById('reel2').innerText = r2;
                    document.getElementById('reel3').innerText = r3;
                    document.getElementById('reel4').innerText = r4;
                    document.getElementById('reel5').innerText = r5;

                    const risultati = [r1, r2, r3, r4, r5];
                    const conteggi = {};
                    let maxCombinazione = 0;

                    risultati.forEach(simbolo => {
                        conteggi[simbolo] = (conteggi[simbolo] || 0) + 1;
                        if (conteggi[simbolo] > maxCombinazione) {
                            maxCombinazione = conteggi[simbolo];
                        }
                    });

                    if (maxCombinazione === 5) {
                        let vincita = 150;
                        credits += vincita;
                        document.getElementById('message').innerText = `🎉 JACKPOT ASSOLUTO! +$${vincita} 🎉`;
                    } else if (maxCombinazione === 4) {
                        let vincita = 50;
                        credits += vincita;
                        document.getElementById('message').innerText = `💰 Grande Vincita! +$${vincita} 💰`;
                    } else if (maxCombinazione === 3) {
                        let vincita = 15;
                        credits += vincita;
                        document.getElementById('message').innerText = `✨ Tris Vincente! +$${vincita} ✨`;
                    } else if (maxCombinazione === 2) {
                        let vincita = 4; 
                        credits += vincita;
                        document.getElementById('message').innerText = `👍 Coppia! Recuperi +$${vincita}`;
                    } else {
                        document.getElementById('message').innerText = "Ritenta! La fortuna gira.";
                    }

                    document.getElementById('credits').innerText = credits;
                    document.getElementById('spinBtn').disabled = false;
                    checkCreditsStatus();
                }
            }, 100);
        }

        function checkCreditsStatus() {
            if (credits < SPIN_COST) {
                document.getElementById('adOverlay').style.display = 'flex';
                document.getElementById('spinBtn').disabled = true;
            } else {
                document.getElementById('adOverlay').style.display = 'none';
                document.getElementById('spinBtn').disabled = false;
            }
        }

        function claimCredits() {
            credits = 100; 
            document.getElementById('credits').innerText = credits;
            checkCreditsStatus();
            document.getElementById('message').innerText = "✅ +100 Monete accreditate!";
        }
    </script>
