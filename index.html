<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine 3x3</title>
    <style>
        body {
            background-color: #0e0e10;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .slot-container {
            margin: 20px auto;
            max-width: 300px;
            background: #18181b;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #ffcc00;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .cell {
            background: #27272a;
            font-size: 2rem;
            padding: 20px 0;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        #btn-gira { background-color: #ef4444; }
        #btn-bonus { background-color: #eab308; color: black; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 10px; color: #eab308; }
    </style>

    <!-- 1. CARICAMENTO SDK CRAZYGAMES V3 -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>

    <h1>Slot Machine 3x3</h1>
    <h2 id="saldo-display">Caricamento saldo...</h2>

    <div class="slot-container">
        <!-- Griglia 3x3 -->
        <div class="grid" id="slot-grid">
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div>
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div>
            <div class="cell">🔥</div><div class="cell">🔥</div><div class="cell">🔥</div>
        </div>

        <!-- Pulsanti di Gioco -->
        <button id="btn-gira" onclick="giraSlot()" disabled>GIRA ($5)</button>
        <button id="btn-bonus" onclick="riceviBonus()" disabled>📺 BONUS GRATIS (+$100)</button>
        
        <div id="status">Inizializzazione SDK in corso...</div>
    </div>

    <!-- 2. LOGICA DI GIOCO E INTEGRAZIONE SDK -->
    <script>
        // Variabili di stato del gioco
        let saldo = 100; // Valore iniziale standard
        const simboli = ["😜", "🔥", "😎", "💎", "💖"];
        
        // Elementi del DOM
        const saldoDisplay = document.getElementById("saldo-display");
        const btnGira = document.getElementById("btn-gira");
        const btnBonus = document.getElementById("btn-bonus");
        const statusTxt = document.getElementById("status");
        const gridCells = document.querySelectorAll(".cell");

        // Funzione asincrona di avvio per inizializzare CrazyGames
        async function inizializzaGioco() {
            try {
                statusTxt.innerText = "Connessione a CrazyGames...";
                
                // Inizializza l'SDK ufficiale v3
                await window.CrazyGames.SDK.init();
                console.log("CrazyGames SDK inizializzato con successo.");
                
                // Comunica alla piattaforma che il caricamento è finito e il gameplay ha inizio
                window.CrazyGames.SDK.game.gameplayStart();
                
                // Recupera i dati salvati sul cloud di CrazyGames
                recuperaSalvataggi();
                
                // Abilita l'interfaccia di gioco
                btnGira.disabled = false;
                btnBonus.disabled = false;
                statusTxt.innerText = "Buona fortuna! La fortuna gira.";
            } catch (error) {
                console.error("Errore nell'inizializzazione dell'SDK:", error);
                statusTxt.innerText = "Errore SDK. Esecuzione in modalità locale.";
                // Abilita i pulsanti anche in caso di fallback locale (es. test sul proprio computer)
                aggiornaGraficaSaldo();
                btnGira.disabled = false;
                btnBonus.disabled = false;
            }
        }

        // Funzione per caricare il saldo dal Data Module di CrazyGames
        function recuperaSalvataggi() {
            try {
                if (window.CrazyGames?.SDK?.data) {
                    // Tenta di leggere la chiave dai server di CrazyGames
                    const saldoSalvato = window.CrazyGames.SDK.data.getItem("slot_user_saldo");
                    if (saldoSalvato !== null) {
                        saldo = parseInt(saldoSalvato, 10);
                        console.log("Salvataggio cloud caricato. Saldo:", saldo);
                    } else {
                        console.log("Nessun salvataggio trovato. Creato nuovo profilo.");
                    }
                }
            } catch (e) {
                console.warn("Impossibile accedere al modulo dati dell'SDK (normale in localhost):", e);
            }
            aggiornaGraficaSaldo();
        }

        // Funzione per salvare il saldo corrente sul cloud di CrazyGames
        function salvaProgressi() {
            aggiornaGraficaSaldo();
            try {
                if (window.CrazyGames?.SDK?.data) {
                    // Salva in modo persistente sul cloud dell'utente
                    window.CrazyGames.SDK.data.setItem("slot_user_saldo", saldo.toString());
                    console.log("Progressi salvati su CrazyGames:", saldo);
                }
            } catch (e) {
                console.error("Errore durante il salvataggio dei progressi:", e);
            }
        }

        // Aggiorna il testo del saldo a schermo
        function aggiornaGraficaSaldo() {
            saldoDisplay.innerText = "$" + saldo;
        }

        // Funzione associata al pulsante GIRA
        function giraSlot() {
            if (saldo < 5) {
                statusTxt.innerText = "Fondi insufficienti! Riscatta il bonus gratis.";
                return;
            }

            // Sottrae il costo della giocata e salva subito
            saldo -= 5;
            salvaProgressi();

            statusTxt.innerText = "I rulli girano...";
            
            // Genera i risultati della slot randomicamente
            let risultati = [];
            gridCells.forEach(cell => {
                const simboloCasuale = simboli[Math.floor(Math.random() * simboli.length)];
                cell.innerText = simboloCasuale;
                risultati.push(simboloCasuale);
            });

            // Logica di vincita basilare (esempio: controlla se la prima riga ha 3 simboli uguali)
            if (risultati[0] === risultati[1] && Array.from(new Set(risultati)).length <= 3) {
                // Calcolo semplificato di una vincita random per aggiungere divertimento
                const vincita = 25;
                saldo += vincita;
                statusTxt.innerText = "Hai vinto $" + vincita + "! 🎉";
                salvaProgressi();
            } else {
                statusTxt.innerText = "Ritenta! La fortuna gira.";
            }
        }

        // Funzione associata al pulsante BONUS GRATIS
        function riceviBonus() {
            saldo += 100;
            statusTxt.innerText = "Bonus di $100 accreditato con successo! 🎁";
            salvaProgressi();
        }

        // Avvia l'inizializzazione dell'app al caricamento della pagina
        window.onload = inizializzaGioco;
    </script>
</body>
</html>
